<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediksi AI — Piala Dunia FIFA 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E14; --bg-panel:#10161F; --bg-panel2:#151D29; --bg-deep:#070A0F;
  --line:#232C3A; --line-soft:#1A222F;
  --text:#EDEEE9; --text-mute:#8B95A5; --text-faint:#5A6376;
  --gold:#D4A72C; --gold-soft:#3A331C; --gold-glow:rgba(212,167,44,.35);
  --green:#4FAE6E; --green-soft:#16291D;
  --red:#E1503F; --red-soft:#2E1714;
  --blue:#4D8FD6; --blue-soft:#16212E;
  --purple:#9B7FD4;
  --radius:14px; --radius-sm:10px;
  --ff-display:'Space Grotesk',sans-serif;
  --ff-body:'Inter',-apple-system,sans-serif;
  --ff-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--ff-body);}
body{min-height:100vh;}
::selection{background:var(--gold-glow);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
input,select{font-family:inherit;}
::-webkit-scrollbar{height:6px;width:6px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--gold);outline-offset:2px;border-radius:6px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

/* ---------------- HEADER ---------------- */
.hdr{border-bottom:1px solid var(--line);background:var(--bg-panel);position:sticky;top:0;z-index:30;}
.hdr-inner{max-width:1080px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:14px;}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0;}
.brand-mark{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold),#8a6d1a);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:0 2px 12px rgba(212,167,44,.25);
}
.brand-name{font-size:16.5px;font-weight:800;font-family:var(--ff-display);letter-spacing:-.01em;}
.brand-sub{font-size:11px;color:var(--text-mute);margin-top:-1px;}
.hdr-right{display:flex;align-items:center;gap:10px;}
.live-pill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-mute);font-family:var(--ff-mono);}
.live-dot{position:relative;display:inline-flex;width:8px;height:8px;border-radius:50%;background:var(--text-faint);}
.live-dot.on{background:var(--green);animation:pulseDot 1.6s ease-in-out infinite;}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(225,80,63,.55);}50%{box-shadow:0 0 0 6px rgba(225,80,63,0);}}
.lang-btn{
  background:var(--bg-panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;
  color:var(--text);font-size:12.5px;font-weight:700;font-family:var(--ff-mono);transition:border-color .15s;
}
.lang-btn:hover{border-color:var(--gold);}

.tabs{max-width:1080px;margin:0 auto;padding:0 18px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  display:flex;align-items:center;gap:6px;padding:10px 12px;background:none;border:none;
  border-bottom:2px solid transparent;color:var(--text-mute);font-size:12.5px;font-weight:600;
  white-space:nowrap;flex-shrink:0;transition:color .15s,border-color .15s;
}
.tab .tab-ic{font-size:13px;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--text);border-bottom-color:var(--gold);}

/* ---------------- MAIN / PANELS ---------------- */
.main{max-width:1080px;margin:0 auto;padding:20px 18px 60px;}
.panel{display:none;animation:fadeUp .35s ease both;}
.panel.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ============================================================================
   CINEMATIC FADE-IN SYSTEM
   ============================================================================
   Additive layer only -- no existing rule above is modified. Drives three
   things: (1) a one-time "boot" fade-in for the whole app shell on first
   load, (2) a richer per-section staggered fade+rise whenever a tab panel
   becomes active (replacing nothing -- .panel.active keeps working exactly
   as before, this just choreographs the children inside it), and (3) a
   scroll-triggered fade-in-from-below for sections as the user scrolls,
   via IntersectionObserver + a small reveal class toggled by JS.
   ============================================================================ */
@keyframes appBootIn{
  from{opacity:0;transform:translateY(14px) scale(.992);filter:blur(4px);}
  to{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
}
#app.boot-in{animation:appBootIn .5s cubic-bezier(.16,.8,.24,1) both;}

@keyframes hdrSlideIn{
  from{opacity:0;transform:translateY(-10px);}
  to{opacity:1;transform:translateY(0);}
}
.hdr.boot-in{animation:hdrSlideIn .5s cubic-bezier(.16,.8,.24,1) both;}

/* Per-tab entrance: every direct "section block" inside the active panel
   gets a staggered fade-up the moment a tab is opened. .reveal-stagger is
   applied by JS to direct children of the panel right after we render its
   innerHTML, so this never needs new markup anywhere in the templates. */
@keyframes sectionFadeIn{
  from{opacity:0;transform:translateY(16px);}
  to{opacity:1;transform:translateY(0);}
}
.reveal-stagger{
  animation:sectionFadeIn .5s cubic-bezier(.16,.8,.24,1) both;
}

/* Scroll-driven reveal: elements start invisible/lowered, then JS adds
   .in-view via IntersectionObserver as they cross into the viewport while
   scrolling. Reduced-motion users (handled globally above) get an instant
   snap instead of an animated transition. */
.scroll-reveal{
  opacity:0;
  transform:translateY(28px);
  transition:opacity .5s cubic-bezier(.16,.8,.24,1), transform .5s cubic-bezier(.16,.8,.24,1);
  will-change:opacity, transform;
}
.scroll-reveal.in-view{
  opacity:1;
  transform:translateY(0);
}

.section-label{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.section-label .bar{width:3px;height:14px;border-radius:2px;background:var(--gold);}
.section-label span.lbl{
  font-family:var(--ff-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-mute);font-weight:600;
}
.section-sub{font-size:12.5px;color:var(--text-mute);margin-top:-6px;margin-bottom:14px;}

/* ---------------- STAT STRIP ---------------- */
.stat-strip{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--line);border-radius:12px;overflow:hidden;margin-bottom:22px;border:1px solid var(--line);
}
.stat-cell{background:var(--bg-panel);padding:16px 18px;}
.stat-val{font-family:var(--ff-mono);font-size:28px;font-weight:700;color:#d4a72c;line-height:1;}
.stat-lbl{font-size:11px;color:white;margin-top:6px;}

/* ---------------- WIN PROBABILITY BOARD ---------------- */
.board{background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:10px 18px 18px;}
.board-row{
  display:grid;grid-template-columns:28px 30px 1fr auto;align-items:center;gap:12px;
  width:100%;padding:10px 4px;background:transparent;border:none;border-bottom:1px solid var(--line-soft);
  text-align:left;
}
.board-row:last-child{border-bottom:none;}
.board-row:hover .row-name{color:var(--gold);}
.rank-num{font-family:var(--ff-mono);font-size:13px;font-weight:700;color:var(--text-faint);}
.rank-num.first{color:var(--gold);}
.flag{font-size:22px;color:silver;line-height:1;display:inline-block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}
.row-name{font-size:14.5px;color:var(--text);font-weight:600;margin-bottom:5px;transition:color .15s;}
.host-badge{
  margin-left:8px;font-size:9.5px;color:var(--green);border:1px solid rgba(79,174,110,.35);
  border-radius:4px;padding:1px 5px;font-family:var(--ff-mono);white-space:nowrap;display:inline-block;
}
.sparkbar{width:100%;height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;}
.sparkbar-fill{height:100%;border-radius:3px;transition:width 900ms cubic-bezier(.2,.8,.2,1);}
.row-pct{font-family:var(--ff-mono);font-size:17px;font-weight:700;color:var(--text);min-width:64px;text-align:right;}
.row-pct.first{color:var(--gold);}
.delta-chip{
  font-family:var(--ff-mono);font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;margin-left:6px;
}
.delta-up{color:var(--green);background:rgba(79,174,110,.12);}
.delta-down{color:var(--red);background:rgba(225,80,63,.12);}

/* ---------------- INFO CARDS ---------------- */
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.info-card{
  background:var(--bg-panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  display:flex;gap:12px;align-items:flex-start;
}
.info-ic{font-size:20px;}
.info-title{font-size:13.5px;color:var(--text);font-weight:600;line-height:1.3;}
.info-sub{font-size:11.5px;color:var(--text-mute);margin-top:4px;}

/* ---------------- TEAMS GRID/LIST ---------------- */
.search-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.search-input{
  flex:1 1 220px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;
  padding:10px 14px;color:var(--text);font-size:13.5px;outline:none;transition:border-color .15s;
}
.search-input:focus{border-color:var(--gold);}
.group-select{
  background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  color:var(--text);font-size:13px;outline:none;
}
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
.team-card{
  display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg-panel);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .15s,transform .15s;
}
.team-card:hover{border-color:var(--gold);transform:translateY(-1px);}
.team-card-name{font-size:14px;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.team-card-meta{font-size:11px;color:var(--text-mute);margin-top:2px;font-family:var(--ff-mono);}
.team-card-pct{font-size:15px;font-family:var(--ff-mono);font-weight:700;color:var(--gold);}

/* ---------------- TEAM DETAIL ---------------- */
.back-btn{
  display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--text-mute);
  font-size:13px;margin-bottom:16px;padding:0;transition:color .15s;
}
.back-btn:hover{color:var(--text);}
.detail-head{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.detail-flag{font-size:48px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}
.detail-name{font-size:24px;font-weight:800;font-family:var(--ff-display);margin:0;}
.detail-meta{font-size:12.5px;color:var(--text-mute);margin-top:4px;font-family:var(--ff-mono);}
.detail-pct-wrap{margin-left:auto;text-align:right;}
.detail-pct-lbl{font-size:11px;color:var(--text-mute);}
.detail-pct{font-size:30px;font-weight:800;color:var(--gold);font-family:var(--ff-mono);line-height:1;}

.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px;}
.card{background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:14px;}
.map-wrap{
  position:relative;width:100%;padding-bottom:62%;border-radius:10px;overflow:hidden;
  background:#0d1620;border:1px solid var(--line-soft);
}
.map-iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.map-loading{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#0d1620;z-index:1;pointer-events:none;
}
.map-spinner{
  width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);
  animation:spin .8s linear infinite;
}
.map-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11.5px;color:var(--text-mute);gap:10px;}
.map-open-link{
  color:var(--blue);font-weight:600;white-space:nowrap;flex-shrink:0;transition:color .15s;
}
.map-open-link:hover{color:var(--gold);}
.stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line-soft);}
.stat-row:last-child{border-bottom:none;}
.stat-row-lbl{font-size:12.5px;color:var(--text-mute);}
.stat-row-val{font-size:13px;color:var(--text);font-family:var(--ff-mono);font-weight:600;}

.factor-row{margin-bottom:12px;}
.factor-head{display:flex;justify-content:space-between;margin-bottom:5px;}
.factor-name{font-size:12.5px;color:var(--text);}
.factor-val{font-size:12px;color:var(--text-mute);font-family:var(--ff-mono);}
.factor-val .wt{color:var(--text-faint);}
.strength-total{
  margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft);
  display:flex;justify-content:space-between;align-items:center;
}
.strength-total-lbl{font-size:13px;font-weight:600;color:var(--text);}
.strength-total-val{font-size:22px;font-weight:800;color:var(--gold);font-family:var(--ff-mono);}

/* ---------------- GROUPS TAB ---------------- */
.group-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px;}
.group-pill{
  min-width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--bg-panel);
  color:var(--text-mute);font-family:var(--ff-mono);font-weight:700;font-size:14px;flex-shrink:0;transition:.15s;
}
.group-pill.active{border-color:var(--gold);background:var(--gold-soft);color:var(--gold);}
.group-table-wrap{background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;overflow:auto;}
.group-table-inner{min-width:360px;}
.gt-head,.gt-row{display:grid;grid-template-columns:24px 1fr 30px 26px 26px 26px 38px 42px;gap:3px;align-items:center;}
.gt-head{padding:10px 12px;font-size:10.5px;color:var(--text-faint);letter-spacing:.06em;
  border-bottom:1px solid var(--line);font-family:var(--ff-mono);}
.gt-row{padding:11px 12px;border-bottom:1px solid var(--line-soft);}
.gt-row:last-child{border-bottom:none;}
.gt-row.qual{background:rgba(22,41,29,.35);}
.gt-rank{font-family:var(--ff-mono);font-size:12.5px;font-weight:700;color:var(--text-faint);}
.gt-rank.qual{color:var(--green);}
.gt-team{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text);font-weight:600;overflow:hidden;}
.gt-team span.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gt-cell{text-align:center;font-size:12.5px;color:var(--text-mute);font-family:var(--ff-mono);}
.gt-pts{text-align:right;font-size:15px;color:var(--text);font-weight:800;font-family:var(--ff-mono);}
.empty-note{padding:24px;text-align:center;color:var(--text-mute);font-size:13px;}
.legend-row{display:flex;gap:16px;margin-top:10px;font-size:11px;color:var(--text-mute);}
.legend-swatch{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--green-soft);
  border:1px solid var(--green);margin-right:6px;}

/* ---------------- OVERALL TAB ---------------- */
.champion-card{
  background:linear-gradient(135deg,var(--gold-soft) 0%,var(--bg-panel) 70%);
  border:1px solid rgba(212,167,44,.27);border-radius:16px;padding:22px 20px;margin-bottom:18px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative;overflow:hidden;
}
.champion-card::before{
  content:"";position:absolute;top:-50%;right:-20%;width:60%;height:200%;
  background:radial-gradient(circle,rgba(212,167,44,.08),transparent 60%);pointer-events:none;
}
.champion-flag{font-size:56px;}
.champion-eyebrow{font-size:11px;color:var(--gold);letter-spacing:.1em;font-family:var(--ff-mono);margin-bottom:4px;}
.champion-name{font-size:26px;font-weight:800;color:var(--text);font-family:var(--ff-display);}
.champion-meta{font-size:12.5px;color:var(--text-mute);margin-top:4px;}
.champion-pct-wrap{text-align:right;margin-left:auto;}
.champion-pct{font-size:38px;font-weight:800;color:var(--gold);font-family:var(--ff-mono);line-height:1;}
.ai-box{background:var(--bg-panel2);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:22px;}
.ai-box p{font-size:13.5px;color:var(--text);line-height:1.65;margin:0;}
.overall-row{display:grid;grid-template-columns:34px 24px 1fr 70px;gap:10px;align-items:center;
  padding:9px 14px;border-bottom:1px solid var(--line-soft);}
.overall-row:last-child{border-bottom:none;}
.overall-rank{font-family:var(--ff-mono);font-size:12px;font-weight:700;color:var(--text-faint);}
.overall-rank.top3{color:var(--gold);}
.overall-name{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.overall-pct{text-align:right;font-family:var(--ff-mono);font-size:13px;font-weight:700;color:var(--text);}
.overall-pct.top{color:var(--gold);}
.list-card{background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;}

/* ---------------- HIGHLIGHTS TAB ---------------- */
.highlights-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.hl-card{background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.hl-thumb-btn{
  position:relative;display:block;width:100%;padding:0;border:none;background:#000;
  aspect-ratio:16/9;overflow:hidden;
}
.hl-thumb-img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s ease,filter .35s ease;
}
.hl-thumb-btn:hover .hl-thumb-img{transform:scale(1.04);filter:brightness(.75);}
.hl-play-overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.35) 100%);
}
.hl-play-icon{
  width:52px;height:52px;border-radius:50%;background:rgba(225,80,63,.92);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:18px;padding-left:3px;
  box-shadow:0 4px 18px rgba(0,0,0,.4);transition:transform .2s ease,background .2s ease;
}
.hl-thumb-btn:hover .hl-play-icon{transform:scale(1.1);background:var(--red);}
.hl-video-wrap{position:relative;width:100%;padding-bottom:56.25%;background:#000;}
.hl-video-iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
.hl-body{padding:12px 14px;}
.hl-score-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.hl-score{font-size:11px;color:var(--text-faint);font-family:var(--ff-mono);}
.hl-group{margin-left:auto;font-size:10px;color:var(--text-faint);font-family:var(--ff-mono);}
.hl-title{font-size:13px;color:var(--text);font-weight:600;line-height:1.3;}
.hl-link{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;color:var(--red);}

/* ---------------- RULES TAB ---------------- */
.rules-intro{font-size:13.5px;color:var(--text);line-height:1.6;margin-bottom:20px;}
.rule-card{background:var(--bg-panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  margin-bottom:10px;display:flex;gap:14px;}
.rule-num{font-family:var(--ff-mono);font-size:13px;font-weight:800;color:var(--gold);min-width:26px;}
.rule-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px;}
.rule-desc{font-size:12.5px;color:var(--text-mute);line-height:1.55;}
.source-notes{margin-top:18px;font-size:11.5px;color:var(--text-faint);line-height:1.6;}

/* ---------------- METHODOLOGY TAB ---------------- */
.method-p{font-size:13.5px;color:var(--text);line-height:1.65;margin-bottom:14px;}
.method-p2{font-size:13px;color:var(--text-mute);line-height:1.65;margin-bottom:20px;}
.factor-def-list{background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:20px;}
.factor-def-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line-soft);}
.factor-def-row:last-child{border-bottom:none;}
.factor-def-name{display:flex;align-items:center;gap:8px;}
.factor-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.factor-def-formula{font-size:11px;color:var(--text-faint);font-family:var(--ff-mono);margin-top:4px;margin-left:16px;}
.factor-def-weight{font-size:13px;color:var(--text-mute);font-family:var(--ff-mono);align-self:center;}
.code-block{
  background:var(--bg-deep);border:1px solid var(--line);border-radius:12px;padding:16px;
  font-family:var(--ff-mono);font-size:12px;color:var(--green);line-height:1.7;margin-bottom:16px;
  overflow-x:auto;white-space:pre;
}
.method-foot{font-size:12px;color:var(--text-faint);line-height:1.6;}

/* ---------------- FOOTER ---------------- */
.ftr{border-top:1px solid var(--line);padding:18px;text-align:center;}
.ftr-note{font-size:11px;color:var(--text-faint);max-width:560px;margin:0 auto;line-height:1.6;}
.ftr-sync{font-size:10.5px;color:var(--text-faint);margin-top:8px;font-family:var(--ff-mono);}

/* ---------------- TOAST ---------------- */
.toast-host{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{
  background:var(--bg-panel2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;
  font-size:12.5px;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.4);
  animation:toastIn .25s ease both;
}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ============================================================================
   AI MATCH PREDICTOR — signature element: an orchestrated "thinking" sequence
   that visualizes how the algorithm scores a single fixture end-to-end.
   ============================================================================ */
.predictor-intro{font-size:13px;color:var(--text-mute);line-height:1.6;margin-bottom:18px;max-width:640px;}

.matchup-picker{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;
  background:var(--bg-panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;
}
.picker-side{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;}
.picker-flag{font-size:46px;line-height:1;transition:transform .2s;}
.picker-select{
  width:100%;max-width:220px;background:var(--bg-panel2);border:1px solid var(--line);border-radius:10px;
  padding:9px 10px;color:var(--text);font-size:13px;text-align:center;outline:none;
}
.picker-vs{
  font-family:var(--ff-mono);font-size:13px;color:var(--text-faint);font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.vs-badge{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg-deep);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text);
}
.predict-btn{
  background:linear-gradient(135deg,var(--gold),#8a6d1a);border:none;border-radius:10px;
  padding:10px 18px;color:#1a1408;font-weight:800;font-size:13px;font-family:var(--ff-mono);
  display:flex;align-items:center;gap:8px;white-space:nowrap;transition:transform .15s,box-shadow .15s;
  box-shadow:0 4px 14px rgba(212,167,44,.25);
}
.predict-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(212,167,44,.35);}
.predict-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.quick-fixtures{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
.quick-fixture-btn{
  background:var(--bg-panel2);border:1px solid var(--line);border-radius:20px;padding:6px 12px;
  font-size:11.5px;color:var(--gold);display:flex;align-items:center;gap:6px;transition:.15s;
}
.quick-fixture-btn:hover{border-color:var(--gold);color:var(--text);}

/* ---- The "AI control room" stage ---- */
.ai-stage{
  background:var(--bg-deep);border:1px solid var(--line);border-radius:18px;padding:20px;
  position:relative;overflow:hidden;min-height:120px;
}
.ai-stage::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(77,143,214,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(77,143,214,.04) 1px, transparent 1px);
  background-size:24px 24px;pointer-events:none;opacity:0;
  transition:opacity .6s ease;
}
.ai-stage.scanning::before{opacity:1;}
.ai-stage-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:30px 0;color:var(--text-faint);text-align:center;
}
.ai-stage-empty .ic{font-size:28px;opacity:.5;}

/* step list */
.ai-steps{display:flex;flex-direction:column;gap:0;}
.ai-step{
  display:grid;grid-template-columns:32px 1fr;gap:14px;padding:14px 4px;
  border-bottom:1px solid var(--line-soft);opacity:0;transform:translateY(10px);
}
.ai-step:last-child{border-bottom:none;}
.ai-step.revealed{animation:stepReveal .5s cubic-bezier(.2,.8,.2,1) forwards;}
@keyframes stepReveal{to{opacity:1;transform:translateY(0);}}
.step-marker{
  width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg-panel);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-faint);
  font-family:var(--ff-mono);flex-shrink:0;transition:border-color .3s,color .3s,background .3s;
}
.step-marker.active{
  border-color:var(--blue);color:var(--blue);background:var(--blue-soft);
  animation:markerPulse 1.2s ease-in-out infinite;
}
.step-marker.done{border-color:var(--green);color:var(--green);background:var(--green-soft);}
@keyframes markerPulse{0%,100%{box-shadow:0 0 0 0 rgba(77,143,214,.4);}50%{box-shadow:0 0 0 5px rgba(77,143,214,0);}}
.step-title{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.step-spinner{
  width:11px;height:11px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--blue);
  animation:spin .7s linear infinite;display:inline-block;
}
@keyframes spin{to{transform:rotate(360deg);}}
.step-body{font-size:12.5px;color:var(--text-mute);line-height:1.6;}

/* count-up numeric readouts inside steps */
.readout-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
.readout-card{background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;}
.readout-team{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);font-weight:600;margin-bottom:6px;}
.readout-num{font-family:var(--ff-mono);font-size:20px;font-weight:800;color:var(--text);}
.readout-num.gold{color:var(--gold);}

/* factor bars during step 2 */
.factor-anim-row{display:grid;grid-template-columns:90px 1fr 36px;gap:8px;align-items:center;margin-bottom:6px;}
.factor-anim-name{font-size:11px;color:var(--text-mute);font-family:var(--ff-mono);}
.factor-anim-track{height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden;}
.factor-anim-fill{height:100%;border-radius:3px;width:0%;transition:width .7s cubic-bezier(.2,.8,.2,1);}
.factor-anim-val{font-size:11px;color:var(--text);font-family:var(--ff-mono);text-align:right;}
.dual-factor-block{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px;}
.dual-factor-col-title{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text);font-weight:700;margin-bottom:8px;}

/* formula build-up (step 3) */
.formula-line{
  font-family:var(--ff-mono);font-size:12px;color:var(--text-faint);padding:4px 0;
  display:flex;justify-content:space-between;gap:10px;opacity:.35;transition:opacity .4s,color .4s;
}
.formula-line .term-val{flex-shrink:0;}
.formula-line.lit{opacity:1;color:var(--text);}
.formula-line .term-val{color:var(--text-mute);}
.formula-line.lit .term-val{color:var(--gold);}
.formula-total{
  display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:10px;
  border-top:1px solid var(--line-soft);font-family:var(--ff-mono);
}
.formula-total-lbl{font-size:12.5px;color:var(--text);font-weight:700;}
.formula-total-val{font-size:20px;font-weight:800;}

/* poisson histogram (step 4) */
.poisson-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px;}
.poisson-col-title{font-size:11.5px;color:var(--text);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.poisson-bars{display:flex;align-items:flex-end;gap:4px;height:64px;}
.poisson-bar{flex:1;border-radius:3px 3px 0 0;min-height:2px;transition:height .6s cubic-bezier(.2,.8,.2,1);}
.poisson-labels{display:flex;gap:4px;margin-top:4px;}
.poisson-labels span{flex:1;text-align:center;font-size:9px;color:var(--text-faint);font-family:var(--ff-mono);}
.lambda-readout{font-size:11px;color:var(--text-mute);margin-top:6px;font-family:var(--ff-mono);}

/* simulation run (step 5) */
.sim-progress-wrap{margin-top:8px;}
.sim-progress-track{height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden;margin-bottom:6px;}
.sim-progress-fill{
  height:100%;border-radius:4px;width:0%;
  background:linear-gradient(90deg,var(--blue),var(--green));
  transition:width .15s linear;
}
.sim-progress-text{font-size:11px;color:var(--text-faint);font-family:var(--ff-mono);display:flex;justify-content:space-between;}
.outcome-bars{display:flex;height:34px;border-radius:8px;overflow:hidden;margin-top:12px;border:1px solid var(--line-soft);}
.outcome-seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--ff-mono);
  color:#fff;width:0%;transition:width .8s cubic-bezier(.2,.8,.2,1);white-space:nowrap;overflow:hidden;}
.outcome-legend{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--text-mute);}

/* final verdict card */
.verdict-card{
  margin-top:18px;border-radius:16px;padding:20px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--gold-soft) 0%,var(--bg-panel) 75%);
  border:1px solid rgba(212,167,44,.3);opacity:0;transform:scale(.97);
  transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1);
}
.verdict-card.show{opacity:1;transform:scale(1);}
.verdict-eyebrow{font-size:11px;color:var(--gold);letter-spacing:.1em;font-family:var(--ff-mono);margin-bottom:10px;
  display:flex;align-items:center;gap:8px;}
.verdict-main{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.verdict-flags{display:flex;align-items:center;gap:10px;font-size:34px;}
.verdict-score{
  font-family:var(--ff-mono);font-size:26px;font-weight:800;color:var(--text);
  background:var(--bg-deep);border:1px solid var(--line);border-radius:10px;padding:8px 16px;
}
.verdict-detail{flex:1;min-width:180px;}
.verdict-winner{font-size:18px;font-weight:800;color:var(--text);font-family:var(--ff-display);}
.verdict-conf{font-size:12px;color:var(--text-mute);margin-top:4px;}
.verdict-conf b{color:var(--gold);font-family:var(--ff-mono);}

/* AI "thinking" typewriter line */
.ai-thinking-line{
  display:flex;align-items:center;gap:8px;font-family:var(--ff-mono);font-size:11.5px;color:var(--blue);
  margin-bottom:14px;min-height:16px;
}
.ai-thinking-cursor{display:inline-block;width:6px;height:13px;background:var(--blue);animation:blink 1s step-end infinite;}
@keyframes blink{50%{opacity:0;}}

.history-strip{display:flex;gap:8px;overflow-x:auto;margin-top:18px;padding-bottom:4px;}
.history-chip{
  flex-shrink:0;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;
  font-size:11px;color:var(--text-mute);display:flex;align-items:center;gap:6px;font-family:var(--ff-mono);
}
/* ============================================================================
   MOBILE RESPONSIVE OVERRIDES
   ============================================================================
   Additive only -- no existing rule above is modified. These overrides kick
   in at narrower breakpoints to fix real overflow/cramping issues found via
   device-width testing (320px through 480px), while leaving tablet/desktop
   layout completely untouched.
   ============================================================================ */
@media (max-width: 600px){
  /* App shell: tighten outer padding so content has more usable width */
  .hdr-inner{padding:12px 14px;gap:10px;}
  .main{padding:16px 12px 48px;}
  .brand-mark{width:34px;height:34px;font-size:16px;}
  .brand-name{font-size:15px;}
  .brand-sub{font-size:10px;}
  .lang-btn{padding:6px 10px;font-size:11.5px;}
  .live-pill{font-size:10px;}
  .tabs{padding:0 12px;}
  .tab{padding:9px 9px;font-size:12px;}

  /* Stat strip: force a steady 2x2 grid instead of collapsing to 1 column,
     so the four tournament stats don't eat the whole first screen */
  .stat-strip{grid-template-columns:repeat(2, 1fr);}
  .stat-cell{padding:13px 14px;}
  .stat-val{font-size:24px;}

  /* Win-probability board rows: let the host badge sit on its own line
     cleanly instead of crowding the team name, and shrink the percentage
     column slightly so long country names don't force extra wrapping */
  .board-row{grid-template-columns:24px 26px 1fr auto;gap:9px;padding:9px 2px;}
  .row-name{font-size:13.5px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;row-gap:3px;}
  .host-badge{margin-left:0;}
  .row-pct{font-size:15px;min-width:54px;}

  /* Team cards / list */
  .teams-grid{grid-template-columns:1fr;}
  .team-card{padding:11px 12px;}

  /* Team detail header: let the percentage block wrap onto its own row
     under the name instead of floating awkwardly to the far right */
  .detail-head{gap:12px;}
  .detail-name{font-size:20px;}
  .detail-pct-wrap{margin-left:0;text-align:left;flex-basis:100%;}
  .detail-pct{font-size:26px;}

  /* AI Match Predictor: the picker is the one place a 3-column grid
     (flag+select / VS+button / flag+select) cannot fit at narrow widths
     because "Jalankan Prediksi / Run Prediction" needs real room. Stack it
     vertically -- team A, then the VS+button, then team B. */
  .matchup-picker{grid-template-columns:1fr;gap:16px;padding:16px;}
  .picker-vs{flex-direction:row;justify-content:center;gap:12px;order:2;}
  .picker-side:first-of-type{order:1;}
  .picker-side:last-of-type{order:3;}
  .picker-select{max-width:100%;}
  .predict-btn{font-size:12.5px;padding:10px 16px;}
  .quick-fixture-btn{font-size:11px;padding:6px 10px;}

  /* AI step readouts / factor bars: narrower label columns so the numeric
     value never gets pushed past the edge of the card */
  .readout-grid{grid-template-columns:1fr;gap:8px;}
  .dual-factor-block{grid-template-columns:1fr;gap:14px;}
  .factor-anim-row{grid-template-columns:72px 1fr 32px;gap:6px;}
  .poisson-wrap{grid-template-columns:1fr;gap:14px;}
  .verdict-main{gap:12px;}
  .verdict-flags{font-size:28px;}
  .verdict-score{font-size:20px;padding:7px 12px;}

  /* Group standings table: keep the existing internal horizontal scroll,
     but shrink the minimum width so two-thirds of the table (through GD)
     is visible without scrolling, and add a visible affordance so users
     know more columns are reachable by swiping */
  .group-table-inner{min-width:0;}
  .gt-head,.gt-row{grid-template-columns:20px 1fr 26px 24px 24px 24px 32px 38px;gap:2px;}
  .gt-head{padding:9px 8px;font-size:9.5px;}
  .gt-row{padding:10px 8px;}
  .gt-team{gap:6px;}
  .gt-team span.nm{font-size:12.5px;}
  .group-table-wrap::after{
    content:"⇠ swipe for more";
    display:block;text-align:center;font-size:10px;color:var(--text-faint);
    font-family:var(--ff-mono);padding:6px 0 2px;
  }

  /* Methodology code block: shrink font and tighten padding so the formula
     lines fit far more readably before the user needs to scroll horizontally,
     and add the same swipe affordance as the group table */
  .code-block{font-size:10.5px;padding:12px;}
  .factor-def-formula{font-size:10px;max-width:100%;white-space:normal;}
  .factor-def-row{grid-template-columns:1fr auto;gap:6px;padding:9px 10px;}

  /* Highlights / champion card: let big flag emoji shrink slightly so the
     champion card never feels cramped against the percentage block */
  .champion-card{padding:18px 16px;gap:14px;}
  .champion-flag{font-size:44px;}
  .champion-pct{font-size:30px;}
  .champion-pct-wrap{margin-left:0;}

  /* Rules / generic cards: slightly tighter padding throughout on very
     narrow phones so text has more breathing room before wrapping */
  .rule-card,.info-card,.card{padding:12px 13px;}
}

@media (max-width: 360px){
  /* Extra-narrow phones (iPhone SE / older Android): one more notch down */
  .stat-val{font-size:22px;}
  .row-pct{font-size:14px;min-width:48px;}
  .detail-name{font-size:18px;}
  .gt-head,.gt-row{grid-template-columns:18px 1fr 24px 22px 22px 22px 30px 34px;}
}

</style>
</head>
<body>

<div id="app" class="boot-in">
  <!-- HEADER -->
  <header class="hdr boot-in" id="hdr">
    <div class="hdr-inner">
      <div class="brand">
        <div class="brand-mark">🏆</div>
        <div class="brand-text">
          <div class="brand-name" data-i18n="appName">Peluang Juara</div>
          <div class="brand-sub" data-i18n="appSub">Piala Dunia FIFA 2026™</div>
        </div>
      </div>
      <div class="hdr-right">
        <div class="live-pill" id="livePill">
          <span class="live-dot" id="liveDot"></span>
          <span data-i18n="live">LANGSUNG</span>
        </div>
        <button class="lang-btn" id="langBtn">EN</button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="dashboard"><span class="tab-ic">📡</span><span data-i18n="tabDashboard">Dasbor</span></button>
      <button class="tab" data-tab="predictor"><span class="tab-ic">🤖</span><span data-i18n="tabPredictor">AI Prediktor</span></button>
      <button class="tab" data-tab="overall"><span class="tab-ic">🏆</span><span data-i18n="tabOverall">Klasemen Akhir</span></button>
      <button class="tab" data-tab="teams"><span class="tab-ic">🌎</span><span data-i18n="tabTeams">Negara</span></button>
      <button class="tab" data-tab="groups"><span class="tab-ic">📋</span><span data-i18n="tabGroups">Klasemen Grup</span></button>
      <button class="tab" data-tab="highlights"><span class="tab-ic">▶️</span><span data-i18n="tabHighlights">Highlight</span></button>
      <button class="tab" data-tab="rules"><span class="tab-ic">📜</span><span data-i18n="tabRules">Peraturan</span></button>
      <button class="tab" data-tab="method"><span class="tab-ic">🧮</span><span data-i18n="tabMethod">Metodologi</span></button>
    </nav>
  </header>

  <!-- MAIN -->
  <main class="main" id="main">
    <div class="panel active" id="panel-dashboard"></div>
    <div class="panel" id="panel-predictor"></div>
    <div class="panel" id="panel-overall"></div>
    <div class="panel" id="panel-teams"></div>
    <div class="panel" id="panel-groups"></div>
    <div class="panel" id="panel-highlights"></div>
    <div class="panel" id="panel-rules"></div>
    <div class="panel" id="panel-method"></div>
  </main>

  <footer class="ftr">
    <div class="ftr-note" data-i18n="footerNote">Proyeksi statistik dari simulasi, bukan jaminan hasil.</div>
    <div class="ftr-sync" id="ftrSync"></div>
  </footer>
</div>

<!-- toast container for ephemeral notices -->
<div id="toastHost" class="toast-host"></div>

<script>
/* ============================================================================
   FIFA WORLD CUP 2026 -- TITLE PROBABILITY ENGINE (standalone HTML build)

/* ============================================================================
   ALGORITHM ENGINE — Strength Score + Monte Carlo Championship Simulation
   ============================================================================ */

// World Cup title years per nation (stable historical fact, source: FIFA.com).
// Used to time-decay the history factor: a 2022 title should count for far
// more than a 1966 one, per critique -- mentality/pedigree fades with decades,
// it shouldn't be a permanent flat bonus.
const TITLE_YEARS = {
  BRA: [1958, 1962, 1970, 1994, 2002],
  GER: [1954, 1974, 1990, 2014],
  ARG: [1978, 1986, 2022],
  URU: [1930, 1950],
  FRA: [1998, 2018],
  ESP: [2010],
  ENG: [1966],
};
const CURRENT_YEAR = 2026;
const HIST_HALF_LIFE = 20; // a title this many years old retains half its fresh value

// Actual FIFA points range across the 48-team field, used to make the rank
// factor ELO-responsive (not just based on ordinal position) -- two teams a
// single rank apart but 80 points apart in rating are meaningfully different.
const FIFA_POINTS_VALUES = TEAMS_RAW.map((t) => t.fifaPoints);
const FIFA_POINTS_MAX = Math.max(...FIFA_POINTS_VALUES);
const FIFA_POINTS_MIN = Math.min(...FIFA_POINTS_VALUES);

// The three co-host nations: a small, venue-specific edge applies only when
// one of these plays a non-host opponent (per critique -- most 2026 fixtures
// are neutral-venue between two non-host nations, e.g. Argentina vs France in
// Miami, and should get no artificial home/away split).
const HOST_CODES = new Set(["USA", "MEX", "CAN"]);

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let x = Math.imul(a ^ (a >>> 15), 1 | a);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function gaussian(rnd, mean, sd) {
  const u1 = Math.max(rnd(), 1e-9), u2 = rnd();
  const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
  return mean + z * sd;
}
function poissonSample(rnd, lambda) {
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  for (;;) {
    p *= rnd();
    if (p <= L) return k;
    k += 1;
    if (k > 12) return k;
  }
}
function poissonPMF(lambda, k) {
  // k! via loop (k is small, <=6 for display)
  let fact = 1;
  for (let i = 2; i <= k; i++) fact *= i;
  return (Math.pow(lambda, k) * Math.exp(-lambda)) / fact;
}

function buildFormLookup(standingsByGroup) {
  const form = {};
  Object.values(standingsByGroup).forEach((rows) => {
    rows.forEach((r) => {
      const ppg = r.p > 0 ? r.pts / r.p : 1.0;
      form[r.code] = { ppg, gd: r.gf - r.ga, played: r.p, gf: r.gf, ga: r.ga, pts: r.pts };
    });
  });
  return form;
}

// Hybrid rank factor: keeps the proven ordinal-rank curve as a base (it
// orders teams correctly), then nudges it by where the team's *actual* FIFA
// points sit within the observed field range. This makes the factor more
// ELO-like/responsive -- e.g. a team 18 points behind #1 (effectively a
// near-tie) reads differently than a team 800 points behind, even if both
// are just "rank 2".
function rankFactorOf(team) {
  const base = 100 / (1 + (team.fifaRank - 1) / 14.0);
  const range = FIFA_POINTS_MAX - FIFA_POINTS_MIN;
  const norm = range > 0 ? (team.fifaPoints - FIFA_POINTS_MIN) / range : 0.5;
  const modifier = (norm - 0.5) * 16; // +/-8 max nudge
  return Math.max(0, Math.min(100, base + modifier));
}

// Tournament form factor: widened the goal-difference saturation window so a
// single big win doesn't immediately max it out (was clamp(15+gd*3, 0, 30),
// saturating at GD=+5; now clamp(15+gd*2, 0, 40), saturating at GD=+12.5).
function formFactorOf(formLookup, code) {
  const f = formLookup[code] || { ppg: 1.0, gd: 0, played: 0 };
  return Math.min(100, (f.ppg / 3.0) * 60 + Math.max(0, Math.min(40, 15 + f.gd * 2)));
}

// History factor with time-decay: each title contributes up to 28 points at
// age zero, halving every HIST_HALF_LIFE years, plus a flat +10 floor so a
// team with zero titles isn't scored at hard zero. A 2022 title is worth far
// more than a 1966 one now, instead of both counting identically forever.
function histFactorOf(code) {
  const years = TITLE_YEARS[code];
  if (!years || years.length === 0) return 10.0;
  let score = 0;
  years.forEach((y) => {
    const age = Math.max(0, CURRENT_YEAR - y);
    const decay = Math.pow(0.5, age / HIST_HALF_LIFE);
    score += 28 * decay;
  });
  return Math.min(100, 10 + score);
}

function computeFactors(team, formLookup, daySeed) {
  const rankFactor = rankFactorOf(team);
  const formFactor = formFactorOf(formLookup, team.code);
  const econFactor = Math.min(100, (Math.log(team.gdpCap) / Math.log(100000)) * 100);
  const demoFactor = Math.min(100, (Math.log(team.pop) / Math.log(350)) * 100);
  const histFactor = histFactorOf(team.code);
  const rnd = mulberry32(hashStr(team.code + "::" + daySeed));
  const luckFactor = Math.max(0, Math.min(100, gaussian(rnd, 50, 22)));
  const strength =
    rankFactor * FACTOR_WEIGHTS.rank + formFactor * FACTOR_WEIGHTS.form +
    econFactor * FACTOR_WEIGHTS.econ + demoFactor * FACTOR_WEIGHTS.demo +
    histFactor * FACTOR_WEIGHTS.hist + luckFactor * FACTOR_WEIGHTS.luck;
  const f = formLookup[team.code] || { ppg: 1.0, gd: 0, played: 0 };
  return { rankFactor, formFactor, econFactor, demoFactor, histFactor, luckFactor, strength, formStats: f };
}

function simulateOneTournament(teams, formLookup, daySeed, simIndex) {
  const rnd = mulberry32(hashStr(daySeed + "::sim::" + simIndex));
  const strengths = {};
  teams.forEach((tm) => {
    // Reuses the exact same factor formulas as computeFactors (rankFactorOf,
    // formFactorOf, histFactorOf) so the single-team detail view and the
    // tournament simulation can never silently drift out of sync.
    const rankFactor = rankFactorOf(tm);
    const formFactor = formFactorOf(formLookup, tm.code);
    const econFactor = Math.min(100, (Math.log(tm.gdpCap) / Math.log(100000)) * 100);
    const demoFactor = Math.min(100, (Math.log(tm.pop) / Math.log(350)) * 100);
    const histFactor = histFactorOf(tm.code);
    const luckFactor = Math.max(0, Math.min(100, gaussian(rnd, 50, 22)));
    strengths[tm.code] =
      rankFactor * FACTOR_WEIGHTS.rank + formFactor * FACTOR_WEIGHTS.form +
      econFactor * FACTOR_WEIGHTS.econ + demoFactor * FACTOR_WEIGHTS.demo +
      histFactor * FACTOR_WEIGHTS.hist + luckFactor * FACTOR_WEIGHTS.luck;
  });

  function playMatch(a, b) {
    let diff = (strengths[a] - strengths[b]) / 22.0;
    // Per critique: only nudge for a host-nation edge when exactly one side
    // is a 2026 co-host (USA/MEX/CAN). Two non-host nations meeting on host
    // soil (e.g. Argentina vs France in Miami) stay fully neutral.
    const aHost = HOST_CODES.has(a), bHost = HOST_CODES.has(b);
    if (aHost && !bHost) diff += 0.18;
    else if (bHost && !aHost) diff -= 0.18;
    const lamA = Math.max(0.45, 1.35 + diff), lamB = Math.max(0.45, 1.35 - diff);
    return [poissonSample(rnd, lamA), poissonSample(rnd, lamB)];
  }

  const groups = {};
  teams.forEach((tm) => (groups[tm.group] = groups[tm.group] || []).push(tm.code));
  const groupRanked = {}, thirdPlaceList = [];
  GROUP_LETTERS.forEach((g) => {
    const codes = groups[g]; if (!codes) return;
    const table = {};
    codes.forEach((c) => (table[c] = { pts: 0, gf: 0, ga: 0 }));
    for (let i = 0; i < codes.length; i++) {
      for (let j = i + 1; j < codes.length; j++) {
        const [ga, gb] = playMatch(codes[i], codes[j]);
        table[codes[i]].gf += ga; table[codes[i]].ga += gb;
        table[codes[j]].gf += gb; table[codes[j]].ga += ga;
        if (ga > gb) table[codes[i]].pts += 3;
        else if (gb > ga) table[codes[j]].pts += 3;
        else { table[codes[i]].pts += 1; table[codes[j]].pts += 1; }
      }
    }
    const ranked = [...codes].sort((x, y) => {
      const px = table[x].pts, py = table[y].pts;
      if (px !== py) return py - px;
      const gdx = table[x].gf - table[x].ga, gdy = table[y].gf - table[y].ga;
      if (gdx !== gdy) return gdy - gdx;
      return table[y].gf - table[x].gf;
    });
    groupRanked[g] = ranked;
    thirdPlaceList.push(ranked[2]);
  });

  const qualified = [];
  GROUP_LETTERS.forEach((g) => groupRanked[g] && qualified.push(groupRanked[g][0], groupRanked[g][1]));
  const bestThirds = [...thirdPlaceList].sort((a, b) => strengths[b] - strengths[a]).slice(0, 8);
  let bracket = [...qualified, ...bestThirds];
  for (let i = bracket.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [bracket[i], bracket[j]] = [bracket[j], bracket[i]];
  }
  while (bracket.length > 1) {
    const next = [];
    for (let i = 0; i < bracket.length; i += 2) {
      const a = bracket[i], b = bracket[i + 1];
      const [ga, gb] = playMatch(a, b);
      let winner;
      if (ga === gb) {
        const pa = strengths[a] / (strengths[a] + strengths[b]);
        winner = rnd() < pa ? a : b;
      } else winner = ga > gb ? a : b;
      next.push(winner);
    }
    bracket = next;
  }
  return bracket[0];
}

function runMonteCarlo(teams, standingsByGroup, daySeed, runs) {
  const formLookup = buildFormLookup(standingsByGroup);
  const wins = {};
  teams.forEach((tm) => (wins[tm.code] = 0));
  for (let i = 0; i < runs; i++) {
    const champ = simulateOneTournament(teams, formLookup, daySeed, i);
    wins[champ] = (wins[champ] || 0) + 1;
  }
  const results = teams.map((tm) => ({ code: tm.code, probability: (wins[tm.code] || 0) / runs }));
  results.sort((a, b) => b.probability - a.probability);
  return results;
}

// Single-match simulator used by the AI Predictor (independent of tournament context)
function simulateSingleMatch(teamA, teamB, formLookup, daySeed, runs) {
  const rnd = mulberry32(hashStr(daySeed + "::match::" + teamA.code + teamB.code));
  let winsA = 0, winsB = 0, draws = 0;
  const scoreTally = {};
  // average strength across a handful of draws to stabilize the headline factor numbers,
  // while still leaving per-run luck variance for the simulation itself
  const factorsA = computeFactors(teamA, formLookup, daySeed);
  const factorsB = computeFactors(teamB, formLookup, daySeed);

  for (let i = 0; i < runs; i++) {
    const luckA = Math.max(0, Math.min(100, gaussian(rnd, 50, 22)));
    const luckB = Math.max(0, Math.min(100, gaussian(rnd, 50, 22)));
    const sA = factorsA.strength - factorsA.luckFactor * FACTOR_WEIGHTS.luck + luckA * FACTOR_WEIGHTS.luck;
    const sB = factorsB.strength - factorsB.luckFactor * FACTOR_WEIGHTS.luck + luckB * FACTOR_WEIGHTS.luck;
    let diff = (sA - sB) / 22.0;
    const aHost = HOST_CODES.has(teamA.code), bHost = HOST_CODES.has(teamB.code);
    if (aHost && !bHost) diff += 0.18;
    else if (bHost && !aHost) diff -= 0.18;
    const lamA = Math.max(0.45, 1.35 + diff), lamB = Math.max(0.45, 1.35 - diff);
    const ga = poissonSample(rnd, lamA), gb = poissonSample(rnd, lamB);
    if (ga > gb) winsA++; else if (gb > ga) winsB++; else draws++;
    const key = ga + "-" + gb;
    scoreTally[key] = (scoreTally[key] || 0) + 1;
  }
  let bestScore = "1-1", bestCount = -1;
  Object.entries(scoreTally).forEach(([k, v]) => { if (v > bestCount) { bestCount = v; bestScore = k; } });

  let diffBase = (factorsA.strength - factorsB.strength) / 22.0;
  const aHostBase = HOST_CODES.has(teamA.code), bHostBase = HOST_CODES.has(teamB.code);
  if (aHostBase && !bHostBase) diffBase += 0.18;
  else if (bHostBase && !aHostBase) diffBase -= 0.18;
  const lamA0 = Math.max(0.45, 1.35 + diffBase), lamB0 = Math.max(0.45, 1.35 - diffBase);

  return {
    factorsA, factorsB,
    pWinA: winsA / runs, pDraw: draws / runs, pWinB: winsB / runs,
    bestScore, bestScoreShare: bestCount / runs,
    lamA: lamA0, lamB: lamB0,
    runs,
  };
}

function parseLiveStandings(liveJson, teams) {
  const nameToCode = {};
  teams.forEach((t) => { nameToCode[t.name.toLowerCase()] = t.code; nameToCode[t.name_id.toLowerCase()] = t.code; });
  const aliases = {
    "south korea": "KOR", "korea republic": "KOR", "czech republic": "CZE", "czechia": "CZE",
    "ivory coast": "CIV", "côte d'ivoire": "CIV", "cote d'ivoire": "CIV",
    "usa": "USA", "united states": "USA", "iran": "IRN", "ir iran": "IRN",
    "bosnia and herzegovina": "BIH", "cabo verde": "CPV", "cape verde": "CPV",
    "dr congo": "COD", "congo dr": "COD", "türkiye": "TUR", "turkiye": "TUR", "turkey": "TUR",
    "curaçao": "CUW", "curacao": "CUW", "saudi arabia": "KSA",
  };
  Object.entries(aliases).forEach(([k, v]) => (nameToCode[k] = v));
  function codeFor(name) { if (!name) return null; return nameToCode[name.toLowerCase().trim()] || null; }

  const table = {};
  teams.forEach((t) => (table[t.code] = { code: t.code, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }));
  let matchesPlayed = 0;
  const recentByTeam = {};
  (liveJson.matches || []).forEach((m) => {
    if (!m.score || !m.score.ft) return;
    const c1 = codeFor(m.team1), c2 = codeFor(m.team2);
    if (!c1 || !c2 || !table[c1] || !table[c2]) return;
    const [g1, g2] = m.score.ft;
    table[c1].p += 1; table[c2].p += 1;
    table[c1].gf += g1; table[c1].ga += g2;
    table[c2].gf += g2; table[c2].ga += g1;
    if (g1 > g2) { table[c1].w += 1; table[c1].pts += 3; table[c2].l += 1; }
    else if (g2 > g1) { table[c2].w += 1; table[c2].pts += 3; table[c1].l += 1; }
    else { table[c1].d += 1; table[c2].d += 1; table[c1].pts += 1; table[c2].pts += 1; }
    matchesPlayed += 1;
    (recentByTeam[c1] = recentByTeam[c1] || []).push({ opp: c2, gf: g1, ga: g2, date: m.date });
    (recentByTeam[c2] = recentByTeam[c2] || []).push({ opp: c1, gf: g2, ga: g1, date: m.date });
  });

  const byGroup = {};
  teams.forEach((t) => (byGroup[t.group] = byGroup[t.group] || []).push(table[t.code]));
  Object.keys(byGroup).forEach((g) => {
    byGroup[g].sort((a, b) => {
      if (b.pts !== a.pts) return b.pts - a.pts;
      const gdA = a.gf - a.ga, gdB = b.gf - b.ga;
      if (gdB !== gdA) return gdB - gdA;
      return b.gf - a.gf;
    });
  });
  return { byGroup, matchesPlayed, rawMatches: liveJson.matches || [], recentByTeam };
}

const LiveData = {
  status: "idle", standings: FALLBACK_STANDINGS, matches: [], matchesPlayed: null, lastSync: null, recentByTeam: {},
  listeners: [],
  onChange(fn) { this.listeners.push(fn); },
  emit() { this.listeners.forEach((fn) => fn(this)); },
  async sync() {
    this.status = "loading"; this.emit();
    try {
      const res = await fetch(LIVE_DATA_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("bad response");
      const json = await res.json();
      const parsed = parseLiveStandings(json, TEAMS_RAW);
      if (parsed.matchesPlayed > 0) {
        this.status = "ok"; this.standings = parsed.byGroup; this.matches = parsed.rawMatches;
        this.matchesPlayed = parsed.matchesPlayed; this.lastSync = new Date(); this.recentByTeam = parsed.recentByTeam;
      } else throw new Error("no matches parsed");
    } catch (e) {
      this.status = "error";
      if (!this.standings || !Object.keys(this.standings).length) this.standings = FALLBACK_STANDINGS;
    }
    this.emit();
  },
};

function fmtPct(p) {
  if (p >= 0.1) return (p * 100).toFixed(1) + "%";
  if (p >= 0.01) return (p * 100).toFixed(2) + "%";
  return (p * 100).toFixed(3) + "%";
}
function fmtMoney(n) { return n >= 1000 ? "$" + Math.round(n / 1000) + "k" : "$" + n; }
function fmtPop(n) { return n.toFixed(1) + "M"; }
function daysUntil(dateStr) {
  const target = new Date(dateStr + "T00:00:00Z");
  return Math.ceil((target - new Date()) / 86400000);
}
function teamByCode(code) { return TEAMS_RAW.find((t) => t.code === code); }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

/* ============================================================================
   FADE-IN ANIMATION HELPERS
   ============================================================================
   Two independent, additive mechanisms:
   1) applySectionStagger(panel) -- runs right after a panel's innerHTML is
      (re)written. It walks the panel's direct children ("sections") and
      gives each one a staggered fade-up via the .reveal-stagger class +
      an inline animation-delay, purely cosmetic, no layout/markup change.
   2) initScrollReveal() -- a single shared IntersectionObserver that finds
      any element carrying .scroll-reveal (added by applySectionStagger to
      the same direct children) and toggles .in-view as it scrolls into the
      viewport, giving the "fade in from below on scroll" effect requested,
      on top of and independent from the tab-switch stagger above.
   Neither mechanism touches existing classes, ids, or structure -- they only
   ever *add* .reveal-stagger / .scroll-reveal / .in-view to elements that
   already exist from the original render*() functions.
   ============================================================================ */
let __scrollRevealObserver = null;

function initScrollReveal() {
  if (__scrollRevealObserver) return __scrollRevealObserver;
  if (!("IntersectionObserver" in window)) return null;
  __scrollRevealObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add("in-view");
        __scrollRevealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08, rootMargin: "0px 0px -6% 0px" });
  return __scrollRevealObserver;
}

function applySectionStagger(panel) {
  if (!panel) return;
  const observer = initScrollReveal();
  // Direct children of the panel are treated as "sections" (stat strips,
  // boards, cards, grids, etc. as authored by each render*() function).
  const sections = Array.from(panel.children);
  sections.forEach((el, i) => {
    // Tab-switch entrance: immediate staggered fade-up, capped delay so a
    // panel with many sections still feels snappy rather than sluggish.
    el.classList.remove("reveal-stagger");
    // force reflow so re-adding the class re-triggers the CSS animation
    // even if the same panel is re-rendered back-to-back (e.g. language toggle)
    void el.offsetWidth;
    el.style.animationDelay = (Math.min(i, 8) * 60) + "ms";
    el.classList.add("reveal-stagger");

    // Scroll entrance: the first couple of sections are already on screen
    // the moment the tab opens (the stagger above handles those), but
    // everything is also eligible for the scroll-from-below reveal so that
    // re-scrolling up and back down, or simply scrolling further into a
    // long tab, keeps producing the fade-in-from-bottom effect.
    el.classList.add("scroll-reveal");
    el.classList.remove("in-view");
    if (observer) {
      observer.observe(el);
    } else {
      // no IntersectionObserver support: just show it immediately
      el.classList.add("in-view");
    }
    // Anything already within the viewport right when the tab opens should
    // reveal immediately rather than waiting for a scroll event.
    requestAnimationFrame(() => {
      const rect = el.getBoundingClientRect();
      if (rect.top < window.innerHeight * 0.92 && rect.bottom > 0) {
        el.classList.add("in-view");
        if (observer) observer.unobserve(el);
      }
    });
  });
}

}

function sleep(ms) { return new Promise((res) => setTimeout(res, ms)); }

async function runAiPrediction() {
  if (PredictorState.teamA === PredictorState.teamB) { showToast(t("pickTwo")); return; }
  // Bump the token first: this invalidates any in-flight sequence (its awaited
  // checks will see a stale token and bail out cleanly) so the user can always
  // restart immediately without waiting for the previous run to finish.
  PredictorState.running = true;
  const myToken = ++PredictorState.runToken;
  const btn = document.getElementById("runPredictBtn");
  btn.disabled = true; btn.textContent = "⏳ " + t("running");

  const teamA = teamByCode(PredictorState.teamA), teamB = teamByCode(PredictorState.teamB);
  const nameA = State.lang === "id" ? teamA.name_id : teamA.name;
  const nameB = State.lang === "id" ? teamB.name_id : teamB.name;
  const stage = document.getElementById("aiStage");
  stage.classList.add("scanning");

  // Pre-compute the full result up front (deterministic given current daySeed),
  // then reveal it progressively for the visual sequence.
  const result = simulateSingleMatch(teamA, teamB, State.formLookup, State.daySeed, 1200);

  stage.innerHTML = `
    <div class="ai-thinking-line" id="thinkingLine"><span id="thinkingText"></span><span class="ai-thinking-cursor"></span></div>
    <div class="ai-steps" id="aiSteps"></div>
  `;
  const stepsHost = document.getElementById("aiSteps");
  const thinkingEl = document.getElementById("thinkingText");

  async function setThinking(msg) {
    if (PredictorState.runToken !== myToken) return;
    thinkingEl.textContent = msg;
  }

  function addStep(html) {
    const div = document.createElement("div");
    div.className = "ai-step";
    div.innerHTML = html;
    stepsHost.appendChild(div);
    requestAnimationFrame(() => div.classList.add("revealed"));
    return div;
  }
  function markerHtml(state, icon) {
    if (state === "active") return `<div class="step-marker active"><span class="step-spinner"></span></div>`;
    if (state === "done") return `<div class="step-marker done">✓</div>`;
    return `<div class="step-marker">${icon}</div>`;
  }

  /* ---- STEP 1: fetch base data ---- */
  await setThinking(t("thinking1"));
  let step1 = addStep(`
    ${markerHtml("active", "1")}
    <div>
      <div class="step-title">${t("step1Title")}</div>
      <div class="step-body">${t("rankFifa")}, ${t("formFactor").toLowerCase()}…</div>
    </div>`);
  await sleep(550);
  if (PredictorState.runToken !== myToken) return;
  await setThinking(t("thinking2"));
  await sleep(500);
  if (PredictorState.runToken !== myToken) return;

  const fA = result.factorsA.formStats, fB = result.factorsB.formStats;
  step1.innerHTML = `
    ${markerHtml("done")}
    <div>
      <div class="step-title">${t("step1Title")}</div>
      <div class="readout-grid">
        <div class="readout-card">
          <div class="readout-team">${FLAG_EMOJI[teamA.code]} ${esc(nameA)}</div>
          <div class="readout-num">#${teamA.fifaRank}</div>
          <div class="step-body">${t("rankFifa")} · ${fA.played} ${t("matchesPlayed").toLowerCase()} · ${fA.gf}-${fA.ga} GF-GA</div>
        </div>
        <div class="readout-card">
          <div class="readout-team">${FLAG_EMOJI[teamB.code]} ${esc(nameB)}</div>
          <div class="readout-num">#${teamB.fifaRank}</div>
          <div class="step-body">${t("rankFifa")} · ${fB.played} ${t("matchesPlayed").toLowerCase()} · ${fB.gf}-${fB.ga} GF-GA</div>
        </div>
      </div>
    </div>`;

  /* ---- STEP 2: weighted factors ---- */
  await setThinking(t("thinking3"));
  let step2 = addStep(`
    ${markerHtml("active", "2")}
    <div><div class="step-title">${t("step2Title")}</div><div class="step-body" id="factorAnimBody"></div></div>`);
  await sleep(450);
  if (PredictorState.runToken !== myToken) return;

  const factorDefs = [
    { key: "rankFactor", label: t("rankFactor"), color: "var(--gold)" },
    { key: "formFactor", label: t("formFactor"), color: "var(--green)" },
    { key: "histFactor", label: t("histFactor"), color: "var(--blue)" },
    { key: "econFactor", label: t("econFactor"), color: "var(--blue)" },
    { key: "demoFactor", label: t("demoFactor"), color: "var(--blue)" },
    { key: "luckFactor", label: t("luckFactor"), color: "var(--red)" },
  ];
  const factorBody = document.getElementById("factorAnimBody");
  factorBody.innerHTML = `
    <div class="dual-factor-block">
      <div>
        <div class="dual-factor-col-title">${FLAG_EMOJI[teamA.code]} ${esc(nameA)}</div>
        <div id="factorColA"></div>
      </div>
      <div>
        <div class="dual-factor-col-title">${FLAG_EMOJI[teamB.code]} ${esc(nameB)}</div>
        <div id="factorColB"></div>
      </div>
    </div>`;
  const colA = document.getElementById("factorColA"), colB = document.getElementById("factorColB");
  factorDefs.forEach((f) => {
    colA.innerHTML += `<div class="factor-anim-row"><span class="factor-anim-name">${f.label}</span><div class="factor-anim-track"><div class="factor-anim-fill" id="fillA-${f.key}" style="background:${f.color}"></div></div><span class="factor-anim-val" id="valA-${f.key}">0</span></div>`;
    colB.innerHTML += `<div class="factor-anim-row"><span class="factor-anim-name">${f.label}</span><div class="factor-anim-track"><div class="factor-anim-fill" id="fillB-${f.key}" style="background:${f.color}"></div></div><span class="factor-anim-val" id="valB-${f.key}">0</span></div>`;
  });
  await setThinking(t("thinking4"));
  for (const f of factorDefs) {
    if (PredictorState.runToken !== myToken) return;
    const vA = result.factorsA[f.key], vB = result.factorsB[f.key];
    document.getElementById(`fillA-${f.key}`).style.width = vA + "%";
    document.getElementById(`valA-${f.key}`).textContent = vA.toFixed(0);
    document.getElementById(`fillB-${f.key}`).style.width = vB + "%";
    document.getElementById(`valB-${f.key}`).textContent = vB.toFixed(0);
    await sleep(220);
  }
  step2.querySelector(".step-marker").outerHTML = markerHtml("done");

  /* ---- STEP 3: Strength Score formula build-up ---- */
  await setThinking(t("thinking5"));
  let step3 = addStep(`
    ${markerHtml("active", "3")}
    <div><div class="step-title">${t("step3Title")}</div><div class="step-body" id="formulaBody"></div></div>`);
  await sleep(300);
  if (PredictorState.runToken !== myToken) return;

  const formulaBody = document.getElementById("formulaBody");
  formulaBody.innerHTML = `
    <div class="dual-factor-block">
      <div id="formulaColA"></div>
      <div id="formulaColB"></div>
    </div>`;
  const fcA = document.getElementById("formulaColA"), fcB = document.getElementById("formulaColB");
  function formulaLinesHtml(prefix) {
    return factorDefs.map((f) => `<div class="formula-line" id="${prefix}-line-${f.key}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:78px;">${f.label}</span><span class="term-val">—</span></div>`).join("")
      + `<div class="formula-total"><span class="formula-total-lbl">${t("strengthScore")}</span><span class="formula-total-val" id="${prefix}-total" style="color:var(--gold)">0.0</span></div>`;
  }
  fcA.innerHTML = formulaLinesHtml("fmA");
  fcB.innerHTML = formulaLinesHtml("fmB");

  for (const f of factorDefs) {
    if (PredictorState.runToken !== myToken) return;
    const lineA = document.getElementById(`fmA-line-${f.key}`), lineB = document.getElementById(`fmB-line-${f.key}`);
    const wt = FACTOR_WEIGHTS[f.key.replace("Factor", "")];
    lineA.querySelector(".term-val").textContent = `${result.factorsA[f.key].toFixed(1)} × ${wt}`;
    lineB.querySelector(".term-val").textContent = `${result.factorsB[f.key].toFixed(1)} × ${wt}`;
    lineA.classList.add("lit"); lineB.classList.add("lit");
    await sleep(160);
  }
  document.getElementById("fmA-total").textContent = result.factorsA.strength.toFixed(1);
  document.getElementById("fmB-total").textContent = result.factorsB.strength.toFixed(1);
  step3.querySelector(".step-marker").outerHTML = markerHtml("done");

  /* ---- STEP 4: Poisson goal model ---- */
  await setThinking(t("thinking6"));
  let step4 = addStep(`
    ${markerHtml("active", "4")}
    <div><div class="step-title">${t("step4Title")}</div><div class="step-body" id="poissonBody"></div></div>`);
  await sleep(450);
  if (PredictorState.runToken !== myToken) return;

  const poissonBody = document.getElementById("poissonBody");
  function poissonBarsHtml(prefix, lam) {
    const ks = [0, 1, 2, 3, 4, 5];
    const pmfs = ks.map((k) => poissonPMF(lam, k));
    const maxP = Math.max(...pmfs);
    const bars = ks.map((k, i) => `<div class="poisson-bar" id="${prefix}-bar-${k}" style="height:2px;background:var(--blue);"></div>`).join("");
    const labels = ks.map((k) => `<span>${k}</span>`).join("");
    return { html: `<div class="poisson-bars">${bars}</div><div class="poisson-labels">${labels}</div>`, pmfs, maxP };
  }
  const pA = poissonBarsHtml("pA", result.lamA), pB = poissonBarsHtml("pB", result.lamB);
  poissonBody.innerHTML = `
    <div class="poisson-wrap">
      <div>
        <div class="poisson-col-title">${FLAG_EMOJI[teamA.code]} ${esc(nameA)}</div>
        ${pA.html}
        <div class="lambda-readout">λ = ${result.lamA.toFixed(2)} ${State.lang === "id" ? "gol/laga" : "goals/match"}</div>
      </div>
      <div>
        <div class="poisson-col-title">${FLAG_EMOJI[teamB.code]} ${esc(nameB)}</div>
        ${pB.html}
        <div class="lambda-readout">λ = ${result.lamB.toFixed(2)}</div>
      </div>
    </div>`;
  await sleep(120);
  [0, 1, 2, 3, 4, 5].forEach((k, i) => {
    setTimeout(() => {
      if (PredictorState.runToken !== myToken) return;
      const hA = Math.max(2, (pA.pmfs[i] / pA.maxP) * 64), hB = Math.max(2, (pB.pmfs[i] / pB.maxP) * 64);
      const elA = document.getElementById(`pA-bar-${k}`), elB = document.getElementById(`pB-bar-${k}`);
      if (elA) elA.style.height = hA + "px";
      if (elB) elB.style.height = hB + "px";
    }, i * 90);
  });
  await sleep(700);
  if (PredictorState.runToken !== myToken) return;
  step4.querySelector(".step-marker").outerHTML = markerHtml("done");

  /* ---- STEP 5: run mini Monte Carlo ---- */
  await setThinking(t("thinking7"));
  let step5 = addStep(`
    ${markerHtml("active", "5")}
    <div><div class="step-title">${t("step5Title")}</div><div class="step-body" id="simBody"></div></div>`);
  await sleep(250);
  if (PredictorState.runToken !== myToken) return;

  const simBody = document.getElementById("simBody");
  simBody.innerHTML = `
    <div class="sim-progress-wrap">
      <div class="sim-progress-track"><div class="sim-progress-fill" id="simFill"></div></div>
      <div class="sim-progress-text"><span id="simCount">0</span><span>${result.runs.toLocaleString("en-US")} ${t("simulations")}</span></div>
    </div>
    <div class="outcome-bars" id="outcomeBars">
      <div class="outcome-seg" id="segA" style="background:var(--gold);"></div>
      <div class="outcome-seg" id="segD" style="background:var(--text-faint);"></div>
      <div class="outcome-seg" id="segB" style="background:var(--blue);"></div>
    </div>
    <div class="outcome-legend">
      <span>${esc(nameA)}</span><span>${t("draw")}</span><span>${esc(nameB)}</span>
    </div>`;

  const simFill = document.getElementById("simFill"), simCount = document.getElementById("simCount");
  const totalRuns = result.runs;
  const animFrames = 24;
  for (let i = 1; i <= animFrames; i++) {
    if (PredictorState.runToken !== myToken) return;
    const frac = i / animFrames;
    simFill.style.width = (frac * 100) + "%";
    simCount.textContent = Math.round(frac * totalRuns).toLocaleString("en-US");
    await sleep(28);
  }
  await sleep(150);
  if (PredictorState.runToken !== myToken) return;
  document.getElementById("segA").style.width = (result.pWinA * 100) + "%";
  document.getElementById("segA").textContent = result.pWinA > 0.12 ? fmtPct(result.pWinA) : "";
  document.getElementById("segD").style.width = (result.pDraw * 100) + "%";
  document.getElementById("segD").textContent = result.pDraw > 0.12 ? fmtPct(result.pDraw) : "";
  document.getElementById("segB").style.width = (result.pWinB * 100) + "%";
  document.getElementById("segB").textContent = result.pWinB > 0.12 ? fmtPct(result.pWinB) : "";
  await sleep(500);
  if (PredictorState.runToken !== myToken) return;
  step5.querySelector(".step-marker").outerHTML = markerHtml("done");

  /* ---- STEP 6: final verdict ---- */
  await setThinking(t("thinking8"));
  await sleep(350);
  if (PredictorState.runToken !== myToken) return;

  const winnerName = result.pWinA >= result.pWinB ? nameA : nameB;
  const gapAB = Math.abs(result.pWinA - result.pWinB);
  let verdictLine, confLabel;
  if (gapAB < 0.12) { verdictLine = t("closeMatch"); confLabel = t("confLow"); }
  else if (gapAB < 0.35) { verdictLine = `${winnerName} ${t("clearFavorite")}`; confLabel = t("confMed"); }
  else { verdictLine = `${winnerName} ${t("strongFavorite")}`; confLabel = t("confHigh"); }

  let verdict = addStep(`
    ${markerHtml("done")}
    <div><div class="step-title">${t("step6Title")}</div></div>`);
  thinkingEl.parentElement.style.display = "none";

  const verdictCard = document.createElement("div");
  verdictCard.className = "verdict-card";
  verdictCard.innerHTML = `
    <div class="verdict-eyebrow">🤖 ${t("aiVerdictEyebrow")}</div>
    <div class="verdict-main">
      <div class="verdict-flags">${FLAG_EMOJI[teamA.code]} <span style="font-size:14px;color:var(--text-mute);">vs</span> ${FLAG_EMOJI[teamB.code]}</div>
      <div class="verdict-score">${result.bestScore}</div>
      <div class="verdict-detail">
        <div class="verdict-winner">${esc(verdictLine)}</div>
        <div class="verdict-conf">${t("mostLikelyScore")} · ${(result.bestScoreShare*100).toFixed(1)}% ${t("simOf")} ${result.runs.toLocaleString("en-US")} ${t("simulations")} · ${t("confidenceLevel")}: <b>${confLabel}</b></div>
      </div>
    </div>
  `;
  stage.appendChild(verdictCard);
  requestAnimationFrame(() => verdictCard.classList.add("show"));

  btn.disabled = false; btn.textContent = "🔁 " + t("rerun");
  PredictorState.running = false;
}

/* ============================================================================
   APP SHELL — header, tabs, init
   ============================================================================ */
const TAB_RENDERERS = {
  dashboard: renderDashboard,
  predictor: renderPredictor,
  overall: renderOverall,
  teams: renderTeams,
  groups: renderGroups,
  highlights: renderHighlights,
  rules: renderRules,
  method: renderMethod,
};

function applyI18nStatic() {
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.getAttribute("data-i18n");
    el.textContent = t(key);
  });
  document.getElementById("langBtn").textContent = State.lang === "id" ? "EN" : "ID";
  document.title = t("appName") + " — " + t("appSub");
}

function renderActivePanel() {
  const fn = TAB_RENDERERS[State.activeTab];
  if (fn) fn();
  const activePanel = document.getElementById("panel-" + State.activeTab);
  applySectionStagger(activePanel);
}

function switchTab(tabKey) {
  if (State.activeTab === tabKey) return;
  State.activeTab = tabKey;
  State.selectedTeamCode = null;
  document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b.dataset.tab === tabKey));
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === "panel-" + tabKey));
  renderActivePanel();
}

function updateSyncUI() {
  const dot = document.getElementById("liveDot");
  dot.classList.toggle("on", LiveData.status === "ok");
  const ftr = document.getElementById("ftrSync");
  if (LiveData.status === "ok" && LiveData.lastSync) {
    ftr.textContent = `${t("lastSync")}: ${LiveData.lastSync.toLocaleTimeString()}`;
  } else if (LiveData.status === "loading") {
    ftr.textContent = t("syncing");
  } else {
    ftr.textContent = t("syncFail");
  }
}

function fullRerender() {
  recomputeDerived();
  applyI18nStatic();
  updateSyncUI();
  renderActivePanel();
}

function init() {
  // Boot-in entrance: let the CSS animation play once, then drop the class
  // so it never accidentally re-triggers (e.g. on later layout reflows).
  const appEl = document.getElementById("app");
  const hdrEl = document.getElementById("hdr");
  [appEl, hdrEl].forEach((el) => {
    if (!el) return;
    el.addEventListener("animationend", () => el.classList.remove("boot-in"), { once: true });
  });

  // tab navigation
  document.getElementById("tabs").addEventListener("click", (e) => {
    const btn = e.target.closest(".tab"); if (!btn) return;
    switchTab(btn.dataset.tab);
  });

  // language toggle
  document.getElementById("langBtn").addEventListener("click", () => {
    State.lang = State.lang === "id" ? "en" : "id";
    fullRerender();
  });

  // delegated click for "open team detail" buttons rendered inside panels
  document.getElementById("main").addEventListener("click", (e) => {
    const openBtn = e.target.closest("[data-action='open-team']");
    if (openBtn) {
      State.selectedTeamCode = openBtn.dataset.team;
      switchTab("teams");
      // switchTab no-ops if already on teams tab, so render explicitly too
      State.activeTab = "teams";
      document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b.dataset.tab === "teams"));
      document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === "panel-teams"));
      renderTeams();
      applySectionStagger(document.getElementById("panel-teams"));
    }
  });

  // live data subscription: whenever sync completes, recompute odds + refresh visible tab
  LiveData.onChange(() => {
    recomputeDerived();
    updateSyncUI();
    if (State.activeTab === "dashboard" || State.activeTab === "overall" || State.activeTab === "groups" ||
        (State.activeTab === "teams" && State.selectedTeamCode)) {
      renderActivePanel();
    }
    if (LiveData.status === "ok") {
      showToast(State.lang === "id" ? "Data live tersinkron — peluang diperbarui." : "Live data synced — odds updated.");
    }
  });

  recomputeDerived();
  applyI18nStatic();
  updateSyncUI();
  renderActivePanel();

  LiveData.sync();
}

document.addEventListener("DOMContentLoaded", init);

</script>
